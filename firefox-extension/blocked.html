<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Deep Focus Intercepted | Antigravity Life OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #0f101c;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: screen;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      text-align: center;
    }

    .container {
      max-width: 460px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .icon {
      font-size: 72px;
      margin-bottom: 24px;
      display: inline-block;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffffff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 500;
    }

    .btn {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn:hover {
      background: #7c3aed;
      transform: scale(1.02);
    }

    .quote {
      font-size: 11px;
      font-style: italic;
      color: rgba(255, 255, 255, 0.25);
      margin-top: 30px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">🛡️</div>
    <h1>DEEP FOCUS ACTIVE</h1>
    <p>
      Your active Pomodoro block is running in the background. Antigravity Life OS has intercepted this website to shield your dopamine pathways and preserve your momentum streak.
    </p>
    <button class="btn" onclick="window.history.back()">↩ Return to Work</button>
    <div class="quote">
      "Energy flows where cognitive attention goes. Stay disciplined."
    </div>
  </div>

</body>
</html>
